[build]
  # Directory containing the serverless functions
  functions = "netlify/functions"

# Optional: Settings for local development using `netlify dev`
[dev]
  # Port for Netlify's local development server (proxy)
  port = 8888
  # Port to run the functions server on locally
  functionsPort = 9999 # Can be different from the proxy port
  # Command to run your frontend dev server (if applicable, e.g., for Next.js)
  # targetPort = 9005 # Your Next.js dev port
  # Automatically open the browser
  # autoLaunch = true

# Optional: Redirects and rewrites if needed, for example, to proxy API calls
# [[redirects]]
#   from = "/api/*"
#   to = "/.netlify/functions/:splat"
#   status = 200
